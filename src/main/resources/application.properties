quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:quarkus_test}
%prod.quarkus.datasource.password=${DB_PASSWORD:quarkus_test}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:15432/quarkus_test}
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2

%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=validate
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.sql-load-script=import.sql
%prod.quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

%test.quarkus.datasource.db-kind=${TEST_DB_KIND:h2}
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:h2:mem:assignment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
%test.quarkus.datasource.username=${TEST_DB_USERNAME:sa}
%test.quarkus.datasource.password=${TEST_DB_PASSWORD:sa}
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false

